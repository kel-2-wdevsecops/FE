services:
  devsecops_fe:
    # Tag versi yang jalan (mis. 1.2.0) ditulis workflow deploy sebagai
    # FE_TAG di .env server (D:\.server\kuliah\d4\devsecops\uts\fe\.env);
    # compose membaca .env yang sama untuk interpolasi. Tanpa FE_TAG (mis.
    # saat validasi di CI) jatuh ke :latest.
    image: ghcr.io/kel-2-wdevsecops/fe:${FE_TAG:-latest}
    # Sengaja tanpa `ports`: cloudflared berada di network uts-net dan
    # menjangkau http://devsecops_fe:8080 langsung, jadi satu-satunya jalan
    # masuk adalah Cloudflare Tunnel. Ini juga syarat BE boleh memercayai
    # header CF-Connecting-IP yang diteruskan nginx ini. Health check workflow
    # berjalan di dalam container (`docker compose exec`). Kalau perlu akses
    # dari host untuk debug, pakai "127.0.0.1:3009:8080", jangan "3009:8080".
    restart: unless-stopped
    networks:
      - uts-net
    environment:
      # Tujuan proxy /api/ di nginx (nginx/default.conf.template): service BE
      # (compose.yaml repo BE) di network yang sama.
      API_UPSTREAM: http://devsecops_be:3008
    # nginx-unprivileged tidak butuh capability apa pun (port 8080, user 101).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Network bersama dengan BE, cloudflared, dan MySQL. Dibuat sekali di server
# (`docker network create uts-net`); workflow deploy juga membuatnya kalau
# belum ada. `external`: compose tidak membuat atau menghapusnya.
networks:
  uts-net:
    external: true
    name: uts-net
